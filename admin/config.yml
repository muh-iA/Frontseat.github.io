# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: muh-iA/Frontseat.github.io
  branch: main
  identity_url: https://auth.decapbridge.com/sites/b5b3990b-b2a7-4d07-ac8a-8f4a752e8ecb
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://marafrontseattourguide.netlify.app

# Where images uploaded through the CMS get saved, and the path used
# to reference them on the live site.
media_folder: "images/uploads"
public_folder: "images/uploads"

publish_mode: simple

collections:

  - name: "trip_types"
    label: "Home Page — Trip Types"
    files:
      - name: "trip_types"
        label: "Trip Types Section"
        file: "content/trip-types.json"
        description: "The six trip type cards shown on the home page."
        fields:
          - label: "Trip Types"
            name: "items"
            widget: "list"
            min: 1
            max: 6
            summary: "{{title}}"
            fields:
              - {label: "Photo", name: "image", widget: "image"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

  - name: "packages"
    label: "Tours & Packages"
    files:
      - name: "packages"
        label: "All Packages"
        file: "content/packages.json"
        description: "Every package shown on the Tours & Packages page. Pick a category for each one — the page groups and filters them automatically."
        fields:
          - label: "Packages"
            name: "items"
            widget: "list"
            summary: "{{title}} ({{fields.category}})"
            fields:
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - {label: "Wildlife Safaris", value: "wildlife"}
                  - {label: "Cultural Tours", value: "cultural"}
                  - {label: "Day Trips", value: "day-trips"}
              - {label: "Photo", name: "image", widget: "image"}
              - label: "Badge Text"
                name: "badge"
                widget: "string"
                required: false
                hint: "Small label shown on the photo, e.g. Most Booked. Leave blank for none."
              - label: "Duration"
                name: "duration"
                widget: "string"
                hint: "e.g. 3 Days / 2 Nights"
              - label: "Group Size"
                name: "guests"
                widget: "string"
                hint: "e.g. 2–6 Guests"
              - {label: "Package Title", name: "title", widget: "string"}
              - label: "Highlights"
                name: "highlights"
                widget: "list"
                hint: "Short bullet points, e.g. Park entry fees included"
                field: {label: "Highlight", name: "item", widget: "string"}
              - label: "Price (KES)"
                name: "price"
                widget: "string"
                required: false
                hint: "Leave blank to show \"On Request\" instead of a price."
              - label: "Price Note"
                name: "priceNote"
                widget: "string"
                required: false
                default: "per person"

  - name: "all_trips"
    label: "Home Page — All Trips Table"
    files:
      - name: "all_trips"
        label: "All Trips Table"
        file: "content/all-trips.json"
        description: "The full trips table near the bottom of the home page."
        fields:
          - label: "Trips"
            name: "items"
            widget: "list"
            summary: "{{name}}"
            fields:
              - {label: "Photo", name: "image", widget: "image"}
              - {label: "Trip Name", name: "name", widget: "string"}
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
                hint: "Short route description, e.g. Nairobi – Mara – Nairobi"
              - label: "Type"
                name: "type"
                widget: "string"
                hint: "Short tag, e.g. Wildlife Safari, Day Trip, Honeymoon"
              - label: "Duration"
                name: "duration"
                widget: "string"
                hint: "e.g. 3 Days / 2 Nights"